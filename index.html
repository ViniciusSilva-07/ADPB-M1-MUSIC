/* ───────── Atualização via GitHub ───────── */
let updShown=false;
async function updWait(){for(let i=0;i<70;i++){const u=await api('/api/update/status');UPDS=u;if(!['idle','checking'].includes(u.state))return u;await sleep(1500)}return UPDS}
async function offerUpdate(u){const ch=(u.log||[]).map(x=>`<li>${esc(x)}</li>`).join('');
 const ok=await ask({t:'Atualização disponível',d:'Uma nova versão do ADPB M1 MUSIC está disponível. Deseja atualizar agora? O aplicativo será reiniciado automaticamente ao final.',
  html:(ch?`<ul class="chl">${ch}</ul>`:'')+(u.active?'<p class="warn">Há downloads em andamento. Eles serão interrompidos durante a atualização.</p>':''),ok:'Atualizar',no:'Agora não'});
 if(!ok)return;
 dlgShow('<div class="spin"></div><h3>Atualizando…</h3><p>Aguarde. O aplicativo será reaberto em instantes.</p>');
 try{await api('/api/update/apply',{method:'POST'});dlgShow('<div class="spin"></div><h3>Reiniciando…</h3><p>O ADPB M1 MUSIC será reaberto já atualizado.</p>')}
 catch(x){dlgHide();await ask({t:'Não foi possível atualizar',d:x.message,ok:'Fechar',no:''})}}
async function updCheck(manual){UPDS={state:'checking'};if($('#set').classList.contains('open'))renderSet();
 try{await api('/api/update/check',{method:'POST'});const u=await updWait();if($('#set').classList.contains('open'))renderSet();
  if(u&&u.state=='available')offerUpdate(u);else if(manual)toast(u.state=='uptodate'?'Você já está na versão mais recente.':updText(u).replace(/<[^>]+>/g,''))}catch(e){if(manual)toast(e.message)}}
setTimeout(async()=>{if(!CFG.auto_update)return;try{const u=await updWait();if(u&&u.state=='available'&&!updShown){updShown=true;offerUpdate(u)}}catch(e){}},2500);

/* ───────── Eventos ───────── */
document.addEventListener('click',async e=>{const b=e.target.closest('#gear,#sclose,#sscrim,[data-nav],[data-set],[data-act],[data-job]');if(!b)return;
 if(b.id=='gear')openSet();else if(b.id=='sclose'||b.id=='sscrim')closeSet();
 else if(b.dataset.nav){SN=b.dataset.nav;renderSet();if(SN=='about'||SN=='upd'){try{if(SN=='about')ABOUT=await api('/api/about');else UPDS=UPDS||await api('/api/update/status')}catch(x){}renderSet()}}
 else if(b.dataset.set)save(b.dataset.set,cv(b.dataset.set,b.dataset.v));
 else if(b.dataset.job){const a=b.dataset.job;
  if(a=='cancel'&&!await ask({t:'Cancelar download?',d:'O progresso parcial deste item será descartado.',ok:'Cancelar download',no:'Voltar',danger:true}))return;
  try{await api(`/api/jobs/${b.dataset.id}/${a}`,{method:'POST'})}catch(x){toast(x.message)}poll()}
 else if(b.dataset.act){const a=b.dataset.act;
  if(a=='pick'){b.disabled=true;try{const r=await api('/api/pick',{method:'POST'});CFG.dest=r.dest}catch(x){toast(x.message)}renderSet()}
  else if(a=='open')api('/api/dest/open',{method:'POST'}).catch(x=>toast(x.message));
  else if(a=='dest0')save('dest',DEF.dest);
  else if(a=='clrhist'){if(await ask({t:'Limpar o histórico?',d:'A lista de downloads concluídos será apagada. Os arquivos continuam na pasta.',ok:'Limpar',danger:true})){await api('/api/history/clear',{method:'POST'});toast('Histórico apagado.')}}
  else if(a=='chk')updCheck(true);
  else if(a=='reset'){if(await ask({t:'Restaurar configurações?',d:'Todas as opções voltarão ao padrão. Seus arquivos e histórico não serão afetados.',ok:'Restaurar',danger:true})){
   try{const r=await api('/api/settings/reset',{method:'POST'});Object.assign(CFG,r.cfg);Object.entries(SYNC).forEach(([k,s])=>S[s]=CFG[k]);applyCfg();renderSet();toast('Configurações restauradas.')}catch(x){toast(x.message)}}}}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.sl)save(t.dataset.sl,cv(t.dataset.sl,t.value));else if(t.dataset.txt)save(t.dataset.txt,t.value.trim())});
document.addEventListener('keydown',e=>{if(e.key!='Escape')return;if($('#dlg').classList.contains('open'))return;if($('#set').classList.contains('open'))closeSet()});
</script>
